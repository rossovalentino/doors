[package]
name = "door-graphics-text"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ab_glyph = { version = "=0.2.32", default-features = false, features = ["libm"] }
ab_glyph_rasterizer = { version = "=0.1.10", default-features = false, features = ["libm"] }
qoi = { version = "=0.4.1", default-features = false, features = ["alloc"] }
# Door Text Unicode stack (no_std + alloc; see README.md).
core_maths = "=0.1.1"
harfrust = { version = "=0.14.0", default-features = false, features = ["libm"] }
skrifa = { version = "=0.48.0", default-features = false, features = ["libm"] }
spin = { version = "=0.12.3", default-features = false, features = ["mutex", "spin_mutex"] }
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-linebreak = "=0.1.5"
unicode-script = "=0.5.8"
unicode-segmentation = "=1.13.3"

[lints]
workspace = true

[dev-dependencies]
qoi = { version = "=0.4.1", default-features = false, features = ["alloc"] }
