[package]
name = "door-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
native = []

[[bin]]
name = "door-audio"
path = "src/main.rs"
required-features = ["native"]
test = false
bench = false

[dependencies]
door-abi = { path = "../../runtime/abi" }
door-rt = { path = "../../runtime/rt" }
door-sys = { path = "../../runtime/sys" }
door-service-protocol = { path = "../../crates/service-protocol" }
# The protected-service request loop (`server`), shared with Init and Storage.
door-system-services = { path = ".." }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
all = "warn"
