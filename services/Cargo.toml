[package]
name = "door-system-services"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
native = []

[[bin]]
name = "door-init"
path = "src/bin/init.rs"
required-features = ["native"]
test = false
bench = false
[[bin]]
name = "door-storage"
path = "src/bin/storage.rs"
required-features = ["native"]
test = false
bench = false
[[bin]]
name = "door-session"
path = "src/bin/session.rs"
required-features = ["native"]
test = false
bench = false
[[bin]]
name = "door-console"
path = "src/bin/console.rs"
required-features = ["native"]
test = false
bench = false

[dependencies]
door-abi = { path = "../runtime/abi" }
door-rt = { path = "../runtime/rt" }
door-sys = { path = "../runtime/sys" }
door-service-protocol = { path = "../crates/service-protocol" }
door-vt = { path = "../crates/vt" }
door-service-client = { path = "../frameworks/service-client" }
door-storage-core = { path = "../fs/storage-core" }
door-file-ops = { path = "../fs/file-ops" }
# Local time for System > Notifications' Do not disturb schedule (Init).
door-locale = { path = "../frameworks/locale" }
# Argon2id password/PIN hashing (P14-LOGON, ADR 0020): RustCrypto, pinned,
# no default features (no alloc, no password-hash/PHC strings); the session
# binary supplies the working memory from its own heap.
argon2 = { version = "=0.5.3", default-features = false }
# SHA-256 that binds an approved Run as administrator to the exact image
# Init loads (no alloc).
sha2 = { version = "=0.10.9", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
all = "warn"
