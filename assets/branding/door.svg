  <path d="M12.7 5.195 Q12.7 5.095 12.8 5.095 L19.51 5.095 Q20.23 5.095 20.23 5.815 L20.23 19.95 Q20.23 20.67 19.51 20.67 L12.8 20.67 Q12.7 20.67 12.7 20.57 Z" fill="url(#rear)"/>
