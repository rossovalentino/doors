[package]
name = "door-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Interactive native file and application shell"

[features]
native = []
[[bin]]
name = "door-shell"
path = "src/main.rs"
required-features = ["native"]
test = false
bench = false

[dependencies]
door-abi = { path = "../../runtime/abi" }
door-sys = { path = "../../runtime/sys" }
door-rt = { path = "../../runtime/rt" }
door-service-client = { path = "../../frameworks/service-client" }
door-service-protocol = { path = "../../crates/service-protocol" }
door-userland = { path = "../../runtime/userland" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
all = "warn"
