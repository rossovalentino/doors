[package]
name = "door-native-fixtures"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original protected Door native runtime and independent raw ABI fixtures"

[features]
native = []

[[bin]]
name = "native-runtime"
path = "src/runtime.rs"
required-features = ["native"]
test = false
bench = false

[[bin]]
name = "native-probe"
path = "src/probe.rs"
required-features = ["native"]
test = false
bench = false

[dependencies]
door-abi = { path = "../../../runtime/abi" }
door-rt = { path = "../../../runtime/rt" }
door-sys = { path = "../../../runtime/sys" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
all = "warn"
