[package]
name = "door-imagehost"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original image host: the executable Init starts for a Windows program too large to capture whole; ntdll's loader lays the program out from its file and runs it in its place"

[[bin]]
name = "imagehost"
path = "src/main.rs"
test = false
bench = false

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
