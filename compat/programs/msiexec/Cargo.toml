[package]
name = "door-msiexec"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original msiexec.exe: Windows Installer's command-line program, a thin entry point over msi.dll's DoorMsiexecMain"

[[bin]]
name = "msiexec"
path = "src/main.rs"
test = false
bench = false

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
