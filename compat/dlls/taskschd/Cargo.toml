[package]
name = "door-taskschd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original Task Scheduler 2.0 (taskschd.dll): the TaskScheduler COM object model over the scheduler Init hosts, with Windows' task XML and type library"

[lib]
name = "taskschd"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime", "door-sys/door-personality"]

[dependencies]
door-abi = { path = "../../../runtime/abi" }
door-sys = { path = "../../../runtime/sys" }
door-locale = { path = "../../../frameworks/locale" }
door-service-client = { path = "../../../frameworks/service-client" }
door-service-protocol = { path = "../../../crates/service-protocol" }
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
