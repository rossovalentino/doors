[package]
name = "door-user32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original Win32 window manager, message queues, controls and dialogs over the Door window service"

[lib]
name = "user32"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-gui-guest/guest-pe", "door-sys/door-personality"]

[dependencies]
door-windows-gui = { path = "../../gui" }
door-windows-gui-guest = { path = "../../gui/guest" }
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }
door-abi = { path = "../../../runtime/abi" }
door-sys = { path = "../../../runtime/sys" }
door-service-client = { path = "../../../frameworks/service-client" }
door-service-protocol = { path = "../../../crates/service-protocol" }
door-pe-icon = { path = "../../../crates/pe-icon", features = ["png", "qoi"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
