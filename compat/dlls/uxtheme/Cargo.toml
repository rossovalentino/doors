[package]
name = "door-uxtheme"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original uxtheme.dll: the theme API as Windows answers it with visual styles off (no theme data: programs draw classic controls), buffered painting, and the dark-mode ordinals over the user's Personalize settings"

[lib]
name = "uxtheme"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
