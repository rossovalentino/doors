[package]
name = "door-ole32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original ole32.dll: apartments, the task allocator, GUID and ProgID helpers, in-process activation (registered class objects, HKCR InprocServer32), PROPVARIANT and HGLOBAL streams"

[lib]
name = "ole32"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime", "door-sys/door-personality"]

[dependencies]
door-abi = { path = "../../../runtime/abi" }
door-sys = { path = "../../../runtime/sys" }
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }
door-com-wire = { path = "../../../crates/com-wire" }
door-service-client = { path = "../../../frameworks/service-client" }
door-service-protocol = { path = "../../../crates/service-protocol" }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
