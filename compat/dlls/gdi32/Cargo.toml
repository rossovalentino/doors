[package]
name = "door-gdi32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original GDI device contexts, objects, regions, raster operations and Door Text output"

[lib]
name = "gdi32"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-gui-guest/guest-pe", "door-sys/door-personality"]

[dependencies]
door-windows-gui = { path = "../../gui" }
door-windows-gui-guest = { path = "../../gui/guest" }
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }
door-graphics-text = { path = "../../../frameworks/text" }
door-initfs = { path = "../../../fs/initfs" }
door-abi = { path = "../../../runtime/abi" }
door-sys = { path = "../../../runtime/sys" }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
