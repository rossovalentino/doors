[package]
name = "door-ws2_32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original Winsock 2 (ws2_32.dll) over door.network: sockets, readiness, names and address text"

[lib]
name = "ws2_32"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
