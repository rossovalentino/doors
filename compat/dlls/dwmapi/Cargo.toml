[package]
name = "door-dwmapi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original dwmapi.dll: the Desktop Window Manager API with composition always on: window attributes (extended frame bounds, cloaking), composition timing at the display rate, frame extension, blur and colorization"

[lib]
name = "dwmapi"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
