[package]
name = "door-crypt32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original crypt32.dll: certificate stores and contexts (memory, system and collection stores, X.509 CERT_INFO, names, signature checks), DPAPI data and memory protection, OID-to-algorithm mapping"

[lib]
name = "crypt32"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }
# X.509 DER parsing and signature checks (door-tls) and the RustCrypto
# AES/GCM/SHA crates it pins (MIT OR Apache-2.0).
door-tls = { path = "../../../crates/tls" }
aes = { version = "=0.8.4", default-features = false }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
sha1 = { version = "=0.10.6", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
