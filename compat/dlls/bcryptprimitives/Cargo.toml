[package]
name = "door-bcryptprimitives"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original bcryptprimitives.dll: ProcessPrng, the process-wide random number generator Chromium and the Windows C runtime read, over the kernel entropy source"

[lib]
name = "bcryptprimitives"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
