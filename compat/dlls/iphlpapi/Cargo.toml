[package]
name = "door-iphlpapi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original IP Helper (iphlpapi.dll) over door.network: adapters, interfaces, addresses, routes and change notifications"

[lib]
name = "iphlpapi"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-service-protocol = { path = "../../../crates/service-protocol" }
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
