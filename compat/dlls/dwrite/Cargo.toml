[package]
name = "door-dwrite"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original DirectWrite (dwrite.dll): the system font collection, custom font files and collections, font faces, glyph metrics and outlines, glyph-run rasterization and system font fallback, for Skia and Chromium text"

[lib]
name = "dwrite"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }
# The Door Text font stack (frameworks/text pins the same versions).
skrifa = { version = "=0.48.0", default-features = false, features = ["libm"] }
ab_glyph_rasterizer = { version = "=0.1.10", default-features = false, features = ["libm"] }
core_maths = "=0.1.1"

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
