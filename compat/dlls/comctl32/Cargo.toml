[package]
name = "door-comctl32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original common controls subset (InitCommonControlsEx, status bar, image lists) over user32 and gdi32"

[lib]
name = "comctl32"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-gui-guest/guest-pe"]

[dependencies]
door-windows-gui = { path = "../../gui" }
door-windows-gui-guest = { path = "../../gui/guest" }
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
