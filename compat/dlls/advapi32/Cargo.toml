[package]
name = "door-advapi32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original advapi32.dll: the registry over the storage hives, process tokens, SIDs, privileges and RtlGenRandom"

[lib]
name = "advapi32"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime", "door-sys/door-personality"]

[dependencies]
door-abi = { path = "../../../runtime/abi" }
door-sys = { path = "../../../runtime/sys" }
door-service-client = { path = "../../../frameworks/service-client" }
door-service-protocol = { path = "../../../crates/service-protocol" }
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }
sha1 = { version = "=0.10.6", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
# CryptoAPI keys: AES and constant-time big integers for RSA, the RustCrypto
# crates (MIT OR Apache-2.0) door-tls already pins.
aes = { version = "=0.8.4", default-features = false }
crypto-bigint = { version = "=0.5.5", default-features = false }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
