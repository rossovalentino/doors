[package]
name = "door-dnsapi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original DNS client API (dnsapi.dll): wire queries over door.network for every record type, record lists, name rules"

[lib]
name = "dnsapi"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-service-protocol = { path = "../../../crates/service-protocol" }
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
