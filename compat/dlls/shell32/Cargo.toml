[package]
name = "door-shell32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original shell32.dll: CommandLineToArgvW, known folders and item ID lists, ShellExecute(Ex) with associations and runas, SHFileOperation, SHGetFileInfo, IsUserAnAdmin, HDROP"

[lib]
name = "shell32"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime", "door-sys/door-personality"]

[dependencies]
door-abi = { path = "../../../runtime/abi" }
door-sys = { path = "../../../runtime/sys" }
door-service-protocol = { path = "../../../crates/service-protocol" }
door-service-client = { path = "../../../frameworks/service-client" }
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
