[package]
name = "door-kernel32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original initial Windows console and process API translation"

[lib]
name = "kernel32"
crate-type = ["rlib"]

[features]
guest-pe = []

[dependencies]
door-windows-abi = { path = "../../abi" }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
