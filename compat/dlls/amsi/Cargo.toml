[package]
name = "door-amsi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original amsi.dll: the Antimalware Scan Interface with no antimalware provider registered, as on a Windows install without one: sessions open and every scan is not detected"

[lib]
name = "amsi"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
