[package]
name = "door-wldp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original wldp.dll: Windows Lockdown Policy queries answering as a system without Windows Defender Application Control or AppLocker policy (no lockdown, files and COM classes allowed)"

[lib]
name = "wldp"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
