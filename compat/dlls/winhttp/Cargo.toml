[package]
name = "door-winhttp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original WinHTTP (winhttp.dll): sessions, synchronous and asynchronous requests, callbacks, headers, redirects, cookies, Basic auth, proxies, TLS 1.3"

[lib]
name = "winhttp"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime", "door-windows-inet/guest-pe"]

[dependencies]
door-http = { path = "../../../crates/http" }
door-windows-inet = { path = "../../inet" }
door-tls = { path = "../../../crates/tls" }
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
