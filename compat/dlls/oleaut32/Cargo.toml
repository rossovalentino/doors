[package]
name = "door-oleaut32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original oleaut32.dll: BSTR, VARIANT and its conversions, SAFEARRAY, dates, IDispatch helpers, type libraries and error info"

[lib]
name = "oleaut32"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime", "door-sys/door-personality"]

[dependencies]
door-abi = { path = "../../../runtime/abi" }
door-sys = { path = "../../../runtime/sys" }
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }
door-com-wire = { path = "../../../crates/com-wire" }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
