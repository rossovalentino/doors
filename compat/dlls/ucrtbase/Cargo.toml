[package]
name = "door-ucrtbase"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original Universal C Runtime (ucrtbase.dll, the api-ms-win-crt-* contracts) over Doors' process heap and file handles"
[lib]
name = "ucrtbase"
crate-type = ["rlib"]
[features]
guest-pe = []
[dependencies]
door-crt = { path = "../../crt" }
# The C99 math library (Rust port of musl's libm, MIT): sin, pow, fma, ...
libm = "=0.2.16"
[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
