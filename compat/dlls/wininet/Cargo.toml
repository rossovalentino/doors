[package]
name = "door-wininet"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original WinINet (wininet.dll): HTTP sessions and requests, InternetOpenUrl, headers, options, callbacks, cookies, URL helpers (ANSI and Unicode)"

[lib]
name = "wininet"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime", "door-windows-inet/guest-pe"]

[dependencies]
door-http = { path = "../../../crates/http" }
door-windows-inet = { path = "../../inet" }
door-pac = { path = "../../../crates/pac" }
door-service-protocol = { path = "../../../crates/service-protocol" }
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
