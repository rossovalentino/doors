[package]
name = "door-secur32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original secur32.dll: the signed-in user's name in the name formats GetUserNameEx gives a local account (SAM-compatible DOMAIN\\user, display name not mapped)"

[lib]
name = "secur32"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
