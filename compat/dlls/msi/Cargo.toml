[package]
name = "door-msi-dll"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original msi.dll: Windows Installer's API (databases, views, records, summary information, sessions, product queries, MsiInstallProduct and its kin) over door-msi's engine, with the basic and full user interfaces"

[lib]
name = "msi"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime", "door-sys/door-personality"]

[dependencies]
door-abi = { path = "../../../runtime/abi" }
door-sys = { path = "../../../runtime/sys" }
door-msi = { path = "../../../crates/msi" }
door-cab = { path = "../../../crates/cab" }
door-service-client = { path = "../../../frameworks/service-client" }
door-service-protocol = { path = "../../../crates/service-protocol" }
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }
sha2 = { version = "=0.10.9", default-features = false }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
