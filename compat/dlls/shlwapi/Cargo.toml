[package]
name = "door-shlwapi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original shlwapi.dll: path helpers, PathMatchSpec, HKCR association queries, QISearch and SHCreateMemStream"

[lib]
name = "shlwapi"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
