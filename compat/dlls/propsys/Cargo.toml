[package]
name = "door-propsys"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Original propsys.dll: property variants and in-memory property stores"

[lib]
name = "propsys"
crate-type = ["rlib"]

[features]
guest-pe = ["door-windows-abi/guest-runtime"]

[dependencies]
door-windows-abi = { path = "../../abi", features = ["guest-heap"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
