[package]
name = "door-windows-inet"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Client transport shared by WinHTTP and WinINet: resolution, TCP with timeouts over ntdll, TLS 1.3 with Windows certificate-error flags"

[features]
guest-pe = []

[dependencies]
door-http = { path = "../../crates/http" }
door-tls = { path = "../../crates/tls" }
door-pac = { path = "../../crates/pac" }
zune-inflate = { version = "=0.2.54", default-features = false, features = ["gzip", "zlib"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
