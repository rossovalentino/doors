[package]
name = "door-ime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Session input-method process: Korean 2-set, Chinese Pinyin and Japanese engines (§53)"

[features]
native = []

[[bin]]
name = "door-ime"
path = "src/main.rs"
required-features = ["native"]
test = false
bench = false

[dependencies]
door-abi = { path = "../../runtime/abi" }
door-sys = { path = "../../runtime/sys" }
door-rt = { path = "../../runtime/rt" }
door-service-client = { path = "../../frameworks/service-client" }
door-service-protocol = { path = "../../crates/service-protocol" }
door-keyboard-layouts = { path = "../../frameworks/keyboard-layouts" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
all = "warn"
