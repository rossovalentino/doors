[package]
name = "door-gallery"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Door UI component gallery (engineering fixture) and the caption-panel assistive client"

[features]
# Guest builds (`--features native`, as the desktop image builds every
# artifact) always publish trees and follow focus through door.accessibility.
native = ["accessibility"]
accessibility = ["door-ui-native/accessibility"]

[[bin]]
name = "door-gallery"
path = "src/main.rs"
required-features = ["native"]
test = false
bench = false

[[bin]]
name = "door-assist"
path = "src/assist_main.rs"
required-features = ["native"]
test = false
bench = false

[dependencies]
door-ui = { path = "../../frameworks/ui" }
door-ui-native = { path = "../../frameworks/ui/native" }
door-accessibility = { path = "../../frameworks/accessibility" }
door-abi = { path = "../../runtime/abi" }
door-rt = { path = "../../runtime/rt" }
door-service-client = { path = "../../frameworks/service-client" }
door-service-protocol = { path = "../../crates/service-protocol" }
door-graphics-core = { path = "../../graphics/compositor" }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
