[package]
name = "door-authenticode"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Authenticode signature verification for Windows executables: image digest, PKCS #7 signer, code-signing chain, timestamps and the verified publisher"

[dependencies]
door-tls = { path = "../tls" }
# Pinned RustCrypto digests (MIT OR Apache-2.0), shared with door-tls.
sha1 = { version = "=0.10.6", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }

[lints]
workspace = true
