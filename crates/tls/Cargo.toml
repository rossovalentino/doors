[package]
name = "door-tls"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sans-IO TLS 1.3 client (P15): handshake, record layer and certificate verification against the Mozilla roots"

[dependencies]
# Pinned RustCrypto primitives (MIT OR Apache-2.0; x25519-dalek BSD-3-Clause)
# and the Mozilla trust anchors (webpki-roots, CDLA-Permissive-2.0).
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets"] }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
hkdf = { version = "=0.12.4", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
sha1 = { version = "=0.10.6", default-features = false }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "ecdh"] }
p384 = { version = "=0.13.1", default-features = false, features = ["ecdsa"] }
webpki-roots = { version = "=1.0.9", default-features = false }

[lints]
workspace = true
